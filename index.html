<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Somoni transfer RUB-TJS</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    min-height: 100vh;
    margin: 0;
    align-items: center;
    justify-content: center;
    background: #f2f2f7;
    color: #1c1c1e;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #f2f2f7; }
    .card { background: #1c1c1e; }
    a.button { background: #0a84ff; }
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 360px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; opacity: 0.7; margin: 0 0 24px; }
  a.button {
    display: block;
    background: #007aff;
    color: #fff;
    text-decoration: none;
    padding: 14px;
    border-radius: 10px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  a.button.secondary {
    background: transparent;
    border: 1px solid currentColor;
    color: inherit;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card">
  <h1>Get Somoni</h1>
  <p id="message">Choose your platform below.</p>
  <a id="ios-link" class="button hidden" href="#">Download for iPhone</a>
  <a id="android-link" class="button hidden" href="#">Download for Android</a>
</div>

<script>
// ---- Paste your real links below. Leave a line as "" if that app isn't
// published yet -- its button just won't be shown. ----
const APP_STORE_URL = "";     // e.g. "https://apps.apple.com/app/moneytj/id0000000000"
const GOOGLE_PLAY_URL = "";   // e.g. "https://play.google.com/store/apps/details?id=..."
// ---------------------------------------------------------------------------

function detectPlatform() {
  const ua = navigator.userAgent || "";
  if (/iPhone|iPad|iPod/i.test(ua)) return "ios";
  if (/Android/i.test(ua)) return "android";
  return "other";
}

(function main() {
  const platform = detectPlatform();

  if (platform === "ios" && APP_STORE_URL) {
    window.location.replace(APP_STORE_URL);
    return;
  }
  if (platform === "android" && GOOGLE_PLAY_URL) {
    window.location.replace(GOOGLE_PLAY_URL);
    return;
  }

  // Desktop visitor, or the visitor's platform isn't published yet --
  // don't guess, show whichever button(s) are actually available.
  const iosLink = document.getElementById("ios-link");
  const androidLink = document.getElementById("android-link");
  const message = document.getElementById("message");

  if (APP_STORE_URL) {
    iosLink.href = APP_STORE_URL;
    iosLink.classList.remove("hidden");
  }
  if (GOOGLE_PLAY_URL) {
    androidLink.href = GOOGLE_PLAY_URL;
    androidLink.classList.remove("hidden");
  }
  if (!APP_STORE_URL && !GOOGLE_PLAY_URL) {
    message.textContent = "Somoni is coming soon.";
  }
})();
</script>

</body>
</html>
