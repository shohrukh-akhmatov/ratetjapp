<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Support for Somoni — TJS Transfers.">
  <title>Somoni Support</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f2f7;
      color: #1c1c1e;
    }
    .card {
      width: min(100%, 520px);
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { margin: 0 0 22px; line-height: 1.55; opacity: .78; }
    .label { font-weight: 650; margin-bottom: 6px; }
    .section { margin-top: 22px; }
    a { color: #007aff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .links { display: flex; flex-wrap: wrap; gap: 10px 18px; }
    @media (prefers-color-scheme: dark) {
      body { background: #000; color: #f2f2f7; }
      .card { background: #1c1c1e; }
      a { color: #0a84ff; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Somoni — Support</h1>
    <p>Need help with Somoni? Contact Shoh Labs and we will assist with app questions or issues.</p>

    <div class="section">
      <div class="label">Support email</div>
      <a href="mailto:shohlabs.dev@gmail.com?subject=Somoni%20Support">shohlabs.dev@gmail.com</a>
    </div>

    <div class="section">
      <div class="label">Legal</div>
      <div class="links">
        <a href="en/privacy-en.html">Privacy Policy (EN)</a>
        <a href="ru/privacy-ru.html">Политика конфиденциальности (RU)</a>
        <a href="en/terms-en.html">Terms of Use (EN)</a>
        <a href="ru/terms-ru.html">Условия использования (RU)</a>
      </div>
    </div>

    <div class="section">
      <a href="download/">Download Somoni</a>
    </div>
  </main>
</body>
</html>
